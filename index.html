<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Race Bar Studio</title>
<style>
:root{--bg:#fafaf9;--p:#fff;--l:#e7e5e4;--t:#1c1917;--m:#78716c;--a:#2563eb}
*{box-sizing:border-box}body{margin:0;font:13px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--t);height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--p);border-bottom:1px solid var(--l)}header b{flex:1;font-size:15px}
.app{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}
aside{background:var(--p);border-right:1px solid var(--l);display:flex;flex-direction:column;min-height:0}
nav{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--l);overflow-x:auto}
nav button{background:none;color:var(--m);padding:6px 9px;font-weight:500}nav button.on{background:#f0efed;color:var(--t)}
.pane{padding:14px;overflow:auto;flex:1;display:none}.pane.on{display:block}
main{padding:20px;overflow:auto}#vwrap,#twrap{max-width:1180px;margin:auto}main.th #vwrap,main:not(.th) #twrap{display:none}
label{display:block;font-size:11px;color:var(--m);margin:10px 0 4px}
input,textarea{width:100%;background:#fff;color:var(--t);border:1px solid var(--l);border-radius:7px;padding:7px 9px;font:inherit}
input:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--a)}
input[type=color]{padding:2px;height:32px}input[type=range]{padding:0}textarea{min-height:64px;resize:vertical}
button{background:var(--a);color:#fff;border:0;border-radius:7px;padding:7px 11px;font:inherit;font-weight:600;cursor:pointer}
button.g{background:#f0efed;color:var(--t)}button:hover{filter:brightness(.95)}
canvas{width:100%;border-radius:10px;display:block;box-shadow:0 1px 4px #0003;background:#fff}#tc{touch-action:none;cursor:move}
#vbar{display:flex;gap:10px;align-items:center;margin:12px 0}#vbar input{flex:1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}small{color:var(--m)}
.br{display:grid;grid-template-columns:10px 1fr 1.3fr 34px 30px;gap:6px;align-items:center;margin:5px 0}
.br i{width:10px;height:10px;border-radius:50%}.br span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.br input{padding:5px 7px}
.pv{height:24px;display:flex;align-items:center;justify-content:center;font-size:18px}.pv img{height:22px;border-radius:3px}
.up{margin:0!important;cursor:pointer;text-align:center;background:#f0efed;border-radius:6px;padding:4px;color:var(--t)!important;font-size:13px!important}
body.render{display:block;height:auto}body.render header,body.render aside,body.render #vbar,body.render #twrap{display:none}body.render .app{display:block}body.render main{padding:0}body.render #vwrap{max-width:none}body.render canvas{width:1920px;border-radius:0;box-shadow:none}
@media(max-width:860px){.app{grid-template-columns:1fr}}
</style></head><body>
<header><b>🏁 Race Bar Studio</b><button class="g" id="cfg">Download config</button><button id="rec">⏺ Record WebM</button></header>
<div class="app"><aside>
<nav id="tabs"><button data-t="data" class="on">Data</button><button data-t="bars">Bars</button><button data-t="style">Style</button><button data-t="audio">Audio</button><button data-t="thumb">Thumbnail</button><button data-t="seo">SEO</button></nav>
<div class="pane on" id="p_data"><label>CSV file</label><input type="file" id="file" accept=".csv,.txt">
<div style="margin-top:8px"><button class="g" id="sample">Sample data</button> <button class="g" id="dlsample">Sample CSV</button></div>
<small><br>Wide: <code>date,A,B,C</code> · Long: <code>date,name,value</code></small></div>
<div class="pane" id="p_bars"><div class="row"><button class="g" id="auto">Auto-match flags</button><button class="g" id="bulk">Bulk upload</button></div>
<input type="file" id="icons" multiple accept="image/*" hidden><datalist id="cl"></datalist>
<small>Type a country (flag) or an emoji, or upload your own image (↑). Images auto-fit the bar height. Bulk upload: file name = series name.</small><div id="barlist"></div></div>
<div class="pane" id="p_style"><div id="fields"></div><label>Text overlays (text|x%|y%|size|color, one per line)</label><textarea id="overlays" placeholder="SUBSCRIBE FOR MORE!|50|97|28|#e11d48"></textarea></div>
<div class="pane" id="p_audio"><label>Preview track (final render uses <code>assets/music.mp3</code>)</label><input type="file" id="music" accept="audio/*">
<div class="row"><div><label>Volume (0–1)</label><input type="number" id="vol" step=".1" min="0" max="1"></div><div><label>Fade-out (sec)</label><input type="number" id="fade" min="0"></div></div></div>
<div class="pane" id="p_thumb"><label>Title (| = new line)</label><input id="thTitle"><label>Line colors (comma separated)</label><input id="thColors">
<div class="row"><div><label>Year range</label><input id="thRange"></div><div><label>Badge</label><input id="thBadge"></div></div>
<label>Bars frame (% of video)</label><input type="number" id="thT" min="0" max="100">
<label>Photos / stickers (multiple)</label><input type="file" id="imgs" accept="image/*" multiple>
<label>Selected size</label><input type="range" id="isz" min="80" max="1200" value="380">
<div style="margin-top:8px"><button class="g" id="idel">Delete selected</button> <button id="mkThumb">Download PNG</button></div><small><br>Drag photos on the preview to position.</small></div>
<div class="pane" id="p_seo"><button class="g" id="gen">Regenerate</button><label>Title</label><input id="sTitle"><label>Description + chapters</label><textarea id="sDesc" style="min-height:200px"></textarea><label>Tags</label><textarea id="sTags"></textarea>
<div style="margin-top:8px"><button class="g" onclick="cp('sTitle')">Copy title</button> <button class="g" onclick="cp('sDesc')">Copy desc</button> <button class="g" onclick="cp('sTags')">Copy tags</button></div></div>
</aside>
<main id="main"><div id="vwrap"><div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="vbar"><button id="play">▶ Play</button><input type="range" id="seek" min="0" max="1000" value="0"><span id="tm">0:00</span></div></div>
<div id="twrap"><canvas id="tc" width="1280" height="720"></canvas></div></main></div>
<script>
const $=id=>document.getElementById(id),C=$('c'),X=C.getContext('2d');
const SAMPLE=`date,Instagram,YouTube,TikTok,Facebook,WhatsApp,Telegram
2015,400,1000,0,1500,900,60
2016,550,1200,100,1700,1000,100
2017,800,1500,250,2000,1300,150
2018,1000,1900,500,2250,1500,200
2019,1100,2000,800,2400,1600,300
2020,1300,2300,1000,2600,2000,400
2021,1500,2500,1400,2800,2200,550
2022,1900,2600,1900,2900,2500,700
2023,2000,2700,2300,3000,2700,800
2024,2200,2800,2700,3050,2900,950`;
const S={title:'Largest Social Media Platforms',sub:'Monthly active users (millions) — sample data',src:'Source: sample data',unit:'',topN:10,dur:30,fps:30,accent:'#2563eb',overlays:'',csv:SAMPLE,thTitle:'Biggest|Social Apps|Ever',thColors:'#16a34a,#e11d48,#2563eb',thRange:'2015–2024',thBadge:'2026',thT:100,icons:{},fl:{},em:{Instagram:'📸',YouTube:'▶️',TikTok:'🎵',Facebook:'👍',WhatsApp:'💬',Telegram:'✈️'},vol:.8,fade:3};
const BG='#F7F5EF',INK='#1b1f2a',MUT='#6b7280',FF='system-ui,"Noto Sans","Liberation Sans",sans-serif';
const FD=[['title','Title','text'],['sub','Subtitle','text'],['src','Source note','text'],['unit','Value suffix (e.g. " M")','text'],['topN','Bars shown','number'],['dur','Duration (sec)','number'],['fps','FPS','number'],['accent','Accent color','color']];
$('fields').innerHTML=FD.map(f=>`<label>${f[1]}</label><input id="f_${f[0]}" type="${f[2]}">`).join('');
let D=null;
function parse(txt){
 const R=txt.trim().split(/\r?\n/).map(r=>r.split(/[,;\t]/).map(s=>s.trim().replace(/^"|"$/g,'')));
 const h=R[0];let dates=[],names=[],vals=[];
 if(h.length===3&&/name|entity/i.test(h[1])){const m={},ns=new Set();R.slice(1).forEach(r=>{(m[r[0]]=m[r[0]]||{})[r[1]]=+r[2]||0;ns.add(r[1])});
  names=[...ns];dates=Object.keys(m).sort((a,b)=>isNaN(a)||isNaN(b)?a.localeCompare(b):a-b);vals=dates.map(d=>names.map(n=>m[d][n]||0))}
 else{names=h.slice(1);R.slice(1).forEach(r=>{dates.push(r[0]);vals.push(names.map((_,i)=>+r[i+1]||0))})}
 const ranks=vals.map(v=>{const o=v.map((x,i)=>i).sort((a,b)=>v[b]-v[a]),r=[];o.forEach((i,k)=>r[i]=k);return r});
 return{dates,names,vals,ranks,max:vals.map(v=>Math.max(...v))};
}
const col=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return`hsl(${h},68%,52%)`};
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,lerp=(a,b,f)=>a+(b-a)*f;
const fmt=v=>Math.round(v).toLocaleString('en-US')+(S.unit||'');
let ICON={},EM={};
function setMaps(){EM={};for(const[k,v]of Object.entries(S.em||{}))EM[k.toLowerCase()]=v}
function loadIcons(){ICON={};return Promise.all(Object.entries(S.icons||{}).map(([n,u])=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=u;ICON[n.toLowerCase()]=i})))}
function state(t){const n=D.dates.length,tt=Math.min(1,t/.92),p=n>1?tt*(n-1):0,k=Math.min(Math.floor(p),Math.max(n-2,0)),k2=Math.min(k+1,n-1),f=p-k,e=ease(f),b=D.dates[k2];
 return{p,mx:lerp(D.max[k],D.max[k2],e)||1,lab:(!isNaN(D.dates[k])&&!isNaN(b))?Math.round(lerp(+D.dates[k],+b,f)):D.dates[Math.round(p)],
 items:D.names.map((nm,i)=>({nm,v:lerp(D.vals[k][i],D.vals[k2][i],e),r:lerp(D.ranks[k][i],D.ranks[k2][i],e)}))}}
const nice=x=>{const p=Math.pow(10,Math.floor(Math.log10(x))),m=x/p;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*p};
function icon(g,nm,x,y,h){const k=nm.toLowerCase(),im=ICON[k];if(im&&im.naturalWidth){const w=Math.min(h*1.6,h*im.naturalWidth/im.naturalHeight);g.save();g.beginPath();g.roundRect(x,y,w,h,h*.1);g.clip();g.drawImage(im,x,y,w,h);g.restore();return w}if(EM[k]){g.font=`${h*.82}px `+FF;g.textAlign='left';g.fillText(EM[k],x,y+h*.82);return h}return 0}
function wrap(g,txt,w){const L=[];let c='';txt.split(' ').forEach(x=>{const t=c?c+' '+x:x;if(g.measureText(t).width>w&&c){L.push(c);c=x}else c=t});L.push(c);return L}
function draw(g,w,h,t){
 g.save();g.scale(w/1920,h/1080);g.fillStyle=BG;g.fillRect(0,0,1920,1080);g.textBaseline='alphabetic';
 if(D){
  const s=state(t),N=+S.topN,top=125,bot=1000,rh=(bot-top)/N,x0=330,mw=900,st=nice(s.mx/4);
  g.font='500 20px '+FF;g.textAlign='center';g.lineWidth=1.5;g.setLineDash([4,6]);
  for(let v=0;v<=s.mx;v+=st){const x=x0+v/s.mx*mw;g.strokeStyle='#dcd8cc';g.beginPath();g.moveTo(x,112);g.lineTo(x,bot);g.stroke();g.fillStyle=MUT;g.fillText(v.toLocaleString('en-US'),x,98)}
  g.setLineDash([]);
  s.items.filter(o=>o.r<N+.6).sort((a,b)=>b.r-a.r).forEach(o=>{
   const y=top+o.r*rh,bh=rh*.76,w2=Math.max(6,o.v/s.mx*mw);g.globalAlpha=Math.max(0,Math.min(1,N+.6-o.r));
   g.fillStyle=col(o.nm);g.beginPath();g.roundRect(x0,y,w2,bh,8);g.fill();
   const is=icon(g,o.nm,x0+w2+10,y,bh);
   g.fillStyle=INK;g.font=`600 ${Math.min(28,bh*.5)}px `+FF;g.textAlign='right';g.fillText(o.nm,x0-14,y+bh*.64);
   g.textAlign='left';g.fillText(fmt(o.v),x0+w2+(is?is+20:14),y+bh*.64);g.globalAlpha=1});
  g.textAlign='right';g.fillStyle=INK;g.font='900 190px '+FF;g.fillText(s.lab,1860,1010);
  const cx=1330,cy=935,r=62,ang=s.p*Math.PI*2;
  g.fillStyle='#fff';g.strokeStyle=MUT;g.lineWidth=7;g.beginPath();g.arc(cx,cy,r,0,7);g.fill();g.stroke();
  for(let i=0;i<12;i++){const q=i*Math.PI/6;g.beginPath();g.moveTo(cx+Math.sin(q)*(r-12),cy-Math.cos(q)*(r-12));g.lineTo(cx+Math.sin(q)*(r-5),cy-Math.cos(q)*(r-5));g.lineWidth=3;g.stroke()}
  [[ang,r-15,5],[ang/12,r-30,7]].forEach(([q,l,wd])=>{g.strokeStyle=INK;g.lineWidth=wd;g.lineCap='round';g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.sin(q)*l,cy-Math.cos(q)*l);g.stroke()});
  const sec=Math.floor(t*S.dur);g.fillStyle=MUT;g.font='600 22px ui-monospace,monospace';g.textAlign='center';g.fillText(Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'),cx,cy+r+32);
 }
 g.textAlign='left';g.fillStyle=INK;g.font='900 66px '+FF;let y=400;wrap(g,S.title,500).forEach(l=>{g.fillText(l,1390,y);y+=76});
 g.fillStyle=MUT;g.font='500 26px '+FF;wrap(g,S.sub,500).forEach(l=>{g.fillText(l,1392,y);y+=34});
 g.font='500 20px '+FF;g.fillText(S.src,80,1055);
 S.overlays.split('\n').filter(Boolean).forEach(l=>{const[tx,x=50,y=50,sz=32,c=INK]=l.split('|');g.font=`800 ${sz}px `+FF;g.fillStyle=c;g.textAlign='center';g.fillText(tx,1920*x/100,1080*y/100)});
 g.restore();
}
const render=t=>{draw(X,1920,1080,t);afx(t)};
window.renderFrame=render;
window.loadConfig=async c=>{Object.assign(S,c);D=parse(S.csv);setMaps();await loadIcons();sync();buildBars();render(0)};
function sync(){FD.forEach(f=>$('f_'+f[0]).value=S[f[0]]);['overlays','thTitle','thColors','thRange','thBadge','thT','vol','fade'].forEach(i=>$(i).value=S[i])}
FD.forEach(f=>$('f_'+f[0]).oninput=e=>{S[f[0]]=f[2]==='number'?+e.target.value:e.target.value;render(cur);thumb()});
['overlays','thTitle','thColors','thRange','thBadge','thT'].forEach(i=>$(i).oninput=e=>{S[i]=e.target.value;setMaps();render(cur);thumb()});
['vol','fade'].forEach(i=>$(i).oninput=e=>{S[i]=+e.target.value});
let cur=0,playing=false,t0=0;
const aud=new Audio();aud.loop=true;let ctx,gn,dst;
$('music').onchange=e=>{const f=e.target.files[0];if(!f)return;aud.src=URL.createObjectURL(f);
 if(!ctx){ctx=new AudioContext();const sr=ctx.createMediaElementSource(aud);gn=ctx.createGain();dst=ctx.createMediaStreamDestination();sr.connect(gn);gn.connect(ctx.destination);gn.connect(dst)}};
function afx(t){if(gn)gn.gain.value=S.vol*Math.min(1,Math.max(0,(1-t)*S.dur/Math.max(S.fade,.01)))}
function aOn(){if(!ctx||!aud.src)return;aud.currentTime=(cur*S.dur)%(aud.duration||1e9);ctx.resume();aud.play()}
function aOff(){aud.pause()}
function frame(now){if(!playing)return;cur=Math.min(1,(now-t0)/(S.dur*1000));$('seek').value=cur*1000;render(cur);tmUp();if(cur>=1){playing=false;aOff();$('play').textContent='▶ Play'}else requestAnimationFrame(frame)}
function tmUp(){const s=Math.floor(cur*S.dur);$('tm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
$('play').onclick=()=>{if(playing){playing=false;aOff();$('play').textContent='▶ Play';return}if(cur>=1)cur=0;t0=performance.now()-cur*S.dur*1000;playing=true;aOn();$('play').textContent='⏸ Pause';requestAnimationFrame(frame)};
$('seek').oninput=e=>{playing=false;aOff();cur=e.target.value/1000;render(cur);tmUp()};
function load(txt){S.csv=txt;D=parse(txt);cur=0;buildBars();render(0);thumb();seo()}
$('file').onchange=e=>{const r=new FileReader();r.onload=()=>load(r.result);r.readAsText(e.target.files[0])};
$('sample').onclick=()=>load(SAMPLE);
const dl=(url,name)=>{const a=document.createElement('a');a.href=url;a.download=name;a.click()};
$('dlsample').onclick=()=>dl(URL.createObjectURL(new Blob([SAMPLE])),'sample.csv');
$('cfg').onclick=()=>dl(URL.createObjectURL(new Blob([JSON.stringify(S,null,1)])),'video-01.json');
// thumbnail with draggable photos
const IM=[];let sel=-1,drag=null;const tc=$('tc');
function thumb(exp){const g=tc.getContext('2d');g.fillStyle=BG;g.fillRect(0,0,1280,720);
 if(D){const s=state(S.thT/100),N=9,rh=705/N;
  s.items.filter(o=>o.r<N).sort((a,b)=>b.r-a.r).forEach(o=>{const y=8+o.r*rh,bh=rh*.86,w=Math.max(30,o.v/s.mx*1000);g.fillStyle=col(o.nm);g.beginPath();g.roundRect(-20,y,w+20,bh,12);g.fill();
   const is=icon(g,o.nm,w+10,y,bh);g.fillStyle=INK;g.font=`900 ${bh*.42}px `+FF;g.textAlign='left';g.fillText(fmt(o.v),w+20+is,y+bh*.66)})}
 IM.forEach((o,i)=>{const w=o.s,h=w*o.img.height/o.img.width;g.save();g.shadowColor='rgba(0,0,0,.3)';g.shadowBlur=26;g.drawImage(o.img,o.x-w/2,o.y-h/2,w,h);g.restore();
  if(i===sel&&!exp){g.strokeStyle=S.accent;g.lineWidth=4;g.strokeRect(o.x-w/2,o.y-h/2,w,h)}});
 g.lineJoin='round';g.textAlign='left';g.font='900 104px '+FF;g.lineWidth=18;g.strokeStyle='#fff';const cs=S.thColors.split(',');
 S.thTitle.split('|').forEach((l,i)=>{g.fillStyle=(cs[i%cs.length]||INK).trim();g.strokeText(l,690,380+i*112);g.fillText(l,690,380+i*112)});
 g.textAlign='right';g.font='900 96px '+FF;g.strokeStyle='#fff';g.lineWidth=16;g.fillStyle=INK;g.strokeText(S.thRange,1250,700);g.fillText(S.thRange,1250,700);
 if(S.thBadge){g.save();g.translate(1110,115);g.rotate(-.1);g.beginPath();g.roundRect(-125,-62,250,124,34);g.fillStyle='#6d28d9';g.fill();g.lineWidth=10;g.strokeStyle='#fff';g.stroke();g.textAlign='center';g.font='900 92px '+FF;g.fillStyle='#fff';g.fillText(S.thBadge,0,32);g.restore()}}
// ---- bars: flags / emoji / custom images ----
const CC='us:United States,gb:United Kingdom,ca:Canada,au:Australia,nz:New Zealand,de:Germany,fr:France,it:Italy,es:Spain,pt:Portugal,nl:Netherlands,be:Belgium,ch:Switzerland,at:Austria,se:Sweden,no:Norway,dk:Denmark,fi:Finland,ie:Ireland,pl:Poland,cz:Czechia,hu:Hungary,ro:Romania,gr:Greece,tr:Turkey,ru:Russia,ua:Ukraine,cn:China,jp:Japan,kr:South Korea,kp:North Korea,in:India,pk:Pakistan,bd:Bangladesh,id:Indonesia,my:Malaysia,sg:Singapore,th:Thailand,vn:Vietnam,ph:Philippines,tw:Taiwan,hk:Hong Kong,sa:Saudi Arabia,ae:United Arab Emirates,il:Israel,ir:Iran,iq:Iraq,eg:Egypt,za:South Africa,ng:Nigeria,ke:Kenya,et:Ethiopia,ma:Morocco,dz:Algeria,gh:Ghana,br:Brazil,ar:Argentina,mx:Mexico,co:Colombia,cl:Chile,pe:Peru,ve:Venezuela,uy:Uruguay,cu:Cuba,kz:Kazakhstan,qa:Qatar,kw:Kuwait,hr:Croatia,rs:Serbia,bg:Bulgaria,sk:Slovakia,is:Iceland,lk:Sri Lanka,np:Nepal,af:Afghanistan,tz:Tanzania,ug:Uganda,sn:Senegal,ec:Ecuador,bo:Bolivia,py:Paraguay,cr:Costa Rica,pa:Panama,do:Dominican Republic,jm:Jamaica';
const CT={usa:'us',uk:'gb','united states of america':'us','great britain':'gb',uae:'ae','czech republic':'cz',korea:'kr','russian federation':'ru'};
CC.split(',').forEach(x=>{const[c,n]=x.split(':');CT[n.toLowerCase()]=c});
$('cl').innerHTML=CC.split(',').map(x=>`<option value="${x.split(':')[1]}">`).join('');
const fc=v=>CT[v.trim().toLowerCase()];
const toURL=(src,cors)=>new Promise((res,rej)=>{const i=new Image();if(cors)i.crossOrigin='anonymous';i.onload=()=>{const k=Math.min(1,160/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/png'))};i.onerror=rej;i.src=src});
const refresh=async()=>{await loadIcons();setMaps();buildBars();render(cur);thumb()};
async function setIcon(nm,src,cors,q){try{S.icons[nm]=await toURL(src,cors);delete S.em[nm]}catch(e){alert('Could not load image for '+nm)}if(!q)await refresh()}
function buildBars(){const el=$('barlist');el.innerHTML='';if(!D)return;
 D.names.forEach(nm=>{const r=document.createElement('div');r.className='br';
  r.innerHTML='<i></i><span></span><input list="cl" placeholder="Flag / emoji"><b class="pv"></b><label class="up">↑<input type="file" accept="image/*" hidden></label>';
  r.children[0].style.background=col(nm);r.children[1].textContent=nm;const inp=r.children[2],pv=r.children[3];inp.value=S.fl[nm]||S.em[nm]||'';
  if(S.icons[nm]){const im=new Image();im.src=S.icons[nm];pv.append(im)}else pv.textContent=S.em[nm]||'';

 const ch=[],m=Math.min(8,n);for(let i=0;i<m;i++){const k=Math.round(i*(n-1)/Math.max(m-1,1));ch.push(`${ts(k/Math.max(n-1,1)*.92*S.dur)} ${D.dates[k]} — #1 ${lead[k]}`)}

 $('sTags').value=[...new Set([...D.names.slice(0,12),...S.title.toLowerCase().split(/\s+/).filter(w=>w.length>3),'bar chart race','data visualization','ranking over time','statistics','data race'])].join(', ')}

 const mr=new MediaRecorder(st,{mimeType:'video/webm;codecs=vp9,opus',videoBitsPerSecond:14e6}),ch=[];
