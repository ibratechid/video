name: Render videos
on:
  workflow_dispatch:
    inputs:
      config: {description: 'Config file OR folder (folder = render all .json inside)', default: 'configs'}
      audio: {description: 'Music file (same for all videos)', default: 'assets/music.mp3'}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CFG: ${{ inputs.config }}
      AUD: ${{ inputs.audio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-liberation fonts-noto-color-emoji
      - run: npm install
      - run: node render.js "$CFG" out "$AUD"
      - uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/*.mp4
          retention-days: 7
